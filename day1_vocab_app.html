<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日单词 · DAY 1</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", Roboto, "Helvetica Neue", sans-serif;
  background: #f5f7fb;
  color: #1a1a2e;
  min-height: 100vh;
  overflow-x: hidden;
}
/* ===== START SCREEN ===== */
#startScreen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 24px;
  text-align: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
}
#startScreen h1 {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
#startScreen .subtitle {
  font-size: 18px;
  opacity: 0.9;
  margin-bottom: 12px;
}
#startScreen .word-count {
  font-size: 14px;
  opacity: 0.7;
  margin-bottom: 48px;
}
#startScreen .start-btn {
  background: #fff;
  color: #764ba2;
  border: none;
  border-radius: 50px;
  padding: 16px 64px;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}
#startScreen .start-btn:active { transform: scale(0.96); }

/* ===== QUIZ SCREEN ===== */
#quizScreen { display: none; }
.quiz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: #fff;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  z-index: 10;
}
.quiz-header .back-btn {
  background: none;
  border: none;
  font-size: 24px;
  color: #666;
  cursor: pointer;
  padding: 4px 8px;
}
.quiz-header .progress-text {
  font-size: 14px;
  color: #999;
  font-weight: 500;
}
.quiz-header .progress-bar-wrap {
  flex: 1;
  height: 6px;
  background: #eee;
  border-radius: 3px;
  margin: 0 16px;
  overflow: hidden;
}
.quiz-header .progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}
.quiz-body {
  padding: 32px 24px 24px;
  max-width: 480px;
  margin: 0 auto;
}
.word-display {
  text-align: center;
  margin-bottom: 24px;
}
.word-display .word {
  font-size: 36px;
  font-weight: 800;
  color: #1a1a2e;
  letter-spacing: 1px;
  margin-bottom: 8px;
  line-height: 1.3;
}
.word-display .word.phrasal { font-size: 28px; }
.word-display .phonetic-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
}
.word-display .phonetic {
  font-size: 18px;
  color: #888;
  font-family: "Times New Roman", serif;
}
.word-display .speaker-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border: none;
  background: #f0f0f5;
  border-radius: 50%;
  cursor: pointer;
  transition: background 0.2s;
  color: #667eea;
  font-size: 18px;
}
.word-display .speaker-btn:active { background: #e0e0ea; }
.word-display .speaker-btn.playing { background: #667eea; color: #fff; }
.example-sentence {
  background: #f8f9ff;
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 28px;
  font-size: 15px;
  line-height: 1.6;
  color: #555;
  text-align: center;
  min-height: 52px;
  border-left: 3px solid #667eea;
}
.example-sentence .highlight-word {
  color: #667eea;
  font-weight: 700;
}
.choices-title {
  font-size: 14px;
  color: #aaa;
  margin-bottom: 12px;
  text-align: center;
  letter-spacing: 1px;
}
.choices-grid {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.choice-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 16px 20px;
  background: #fff;
  border: 2px solid #e8e8f0;
  border-radius: 14px;
  font-size: 17px;
  color: #333;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}
.choice-btn .choice-label {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #f0f0f5;
  font-size: 13px;
  font-weight: 700;
  color: #888;
  flex-shrink: 0;
  transition: all 0.2s;
}
.choice-btn:active { transform: scale(0.98); }
.choice-btn.correct {
  border-color: #4caf50;
  background: #e8f5e9;
}
.choice-btn.correct .choice-label {
  background: #4caf50;
  color: #fff;
}
.choice-btn.wrong {
  border-color: #f44336;
  background: #ffebee;
}
.choice-btn.wrong .choice-label {
  background: #f44336;
  color: #fff;
}
.choice-btn.reveal-correct {
  border-color: #4caf50;
  background: #e8f5e9;
}
.choice-btn.reveal-correct .choice-label {
  background: #4caf50;
  color: #fff;
}
.choice-btn.disabled { pointer-events: none; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}
.quiz-footer {
  text-align: center;
  padding: 24px;
  color: #bbb;
  font-size: 13px;
}

/* ===== ANSWER (DETAIL) SCREEN ===== */
#answerScreen { display: none; }
.answer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
}
.answer-header .back-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: #fff;
  font-size: 14px;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
}
.answer-body {
  padding: 24px;
  max-width: 480px;
  margin: 0 auto;
}
.answer-word-section {
  text-align: center;
  margin-bottom: 24px;
  padding: 32px 20px 24px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.answer-word-section .word {
  font-size: 34px;
  font-weight: 800;
  color: #1a1a2e;
  margin-bottom: 6px;
}
.answer-word-section .word.phrasal { font-size: 26px; }
.answer-word-section .phonetic {
  font-size: 17px;
  color: #888;
  font-family: "Times New Roman", serif;
  margin-bottom: 4px;
}
.answer-word-section .chinese-mean {
  font-size: 20px;
  color: #333;
  font-weight: 600;
  margin-top: 8px;
  padding: 8px 20px;
  background: #f0f4ff;
  border-radius: 8px;
  display: inline-block;
}
.answer-word-section .word-type {
  font-size: 13px;
  color: #999;
  margin-top: 4px;
}
.answer-detail-card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.answer-detail-card .card-label {
  font-size: 12px;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.answer-detail-card .en-sentence {
  font-size: 16px;
  line-height: 1.6;
  color: #333;
  margin-bottom: 4px;
}
.answer-detail-card .cn-translation {
  font-size: 15px;
  color: #888;
  line-height: 1.5;
}
.answer-detail-card .phrase-item {
  font-size: 15px;
  color: #555;
  line-height: 1.7;
  padding: 4px 0;
}
.answer-detail-card .phrase-item .phrase-en { font-weight: 600; }
.answer-detail-card .phrase-item .phrase-cn { color: #888; margin-left: 8px; }
.continue-btn-wrap {
  text-align: center;
  padding: 16px 0 40px;
}
.continue-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 16px 56px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 6px 20px rgba(102,126,234,0.4);
}
.continue-btn:active { transform: scale(0.96); }
.continue-btn .arrow { font-size: 22px; }

/* ===== COMPLETION SCREEN ===== */
#completeScreen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 40px 24px;
  text-align: center;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
}
#completeScreen .trophy { font-size: 72px; margin-bottom: 16px; }
#completeScreen h1 { font-size: 32px; margin-bottom: 8px; }
#completeScreen p { font-size: 16px; opacity: 0.85; margin-bottom: 32px; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 12px 24px;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s;
  z-index: 100;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: #4caf50; color: #fff; }
.toast.error { background: #f44336; color: #fff; }

/* ===== RESPONSIVE ===== */
@media (max-width: 420px) {
  .word-display .word { font-size: 30px; }
  .word-display .word.phrasal { font-size: 22px; }
  .answer-word-section .word { font-size: 28px; }
  .answer-word-section .word.phrasal { font-size: 22px; }
  .choice-btn { padding: 14px 16px; font-size: 15px; }
}

/* ===== LOADING SPINNER ===== */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(102,126,234,0.3);
  border-top-color: #667eea;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ===== START SCREEN ===== -->
<div id="startScreen">
  <h1>📖 DAY 1</h1>
  <div class="subtitle">每日单词打卡</div>
  <div class="word-count">共 140 个词汇 · 基础必背 + 雅思 + 学科综合</div>
  <button class="start-btn" onclick="startQuiz()">开始学习</button>
</div>

<!-- ===== QUIZ SCREEN ===== -->
<div id="quizScreen">

    <button class="back-btn" onclick="goHome()">✕</button>

</div>

<!-- ===== ANSWER (DETAIL) SCREEN ===== -->
<div id="answerScreen">
  <div class="answer-header">
    <span style="font-weight:700;">📖 单词详情</span>
    <button class="back-btn" onclick="goHome()">返回首页</button>

    </div>
    <div class="answer-detail-card">
      <div class="card-label">📝 英文例句</div>
      <div class="en-sentence" id="ansExampleEn">Loading...</div>
    </div>
    <div class="answer-detail-card">
      <div class="card-label">🌏 中文翻译</div>
      <div class="cn-translation" id="ansExampleCn">加载中...</div>
    </div>
    <div id="ansPhrasesContainer" style="display:none;">
      <div class="answer-detail-card">
        <div class="card-label">🔗 常用搭配</div>
        <div id="ansPhrases"></div>
      </div>
    </div>
    <div class="continue-btn-wrap">
      <button class="continue-btn" onclick="nextWord()">
        继续 <span class="arrow">→</span>
      </button>
    </div>
  </div>
</div>

<!-- ===== COMPLETION SCREEN ===== -->
<div id="completeScreen">
  <div class="trophy">🎉</div>
  <h1>DAY 1 完成！</h1>
  <p>恭喜你完成了今日全部 140 个单词的学习！<br>明天继续加油 💪</p>
  <button class="start-btn" onclick="goHome()" style="background:#fff;color:#764ba2;border:none;border-radius:50px;padding:16px 56px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 8px 25px rgba(0,0,0,0.2);">👍 太棒了</button>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

// ============================================================
// APP STATE
// ============================================================
let currentIndex = 0;
let shuffled = [];
let utterance = null;

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getVisibleState() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('answerScreen').style.display = 'none';
  document.getElementById('completeScreen').style.display = 'none';
}

// ============================================================
// NAVIGATION
// ============================================================
function startQuiz() {
  shuffled = shuffleArray([...WORDS]);
  currentIndex = 0;
  showQuiz(currentIndex);
}

function goHome() {
  if (utterance && window.speechSynthesis) window.speechSynthesis.cancel();
  getVisibleState();
  document.getElementById('startScreen').style.display = 'flex';
}

function nextWord() {
  if (utterance && window.speechSynthesis) window.speechSynthesis.cancel();
  currentIndex++;
  if (currentIndex >= shuffled.length) {
    showComplete();
  } else {
    showQuiz(currentIndex);
  }
}

function showComplete() {
  getVisibleState();
  document.getElementById('completeScreen').style.display = 'flex';
}

// ============================================================
// QUIZ
// ============================================================
function showQuiz(index) {
  getVisibleState();
  document.getElementById('quizScreen').style.display = 'block';

  const word = shuffled[index];
  const total = shuffled.length;
  document.getElementById('progressText').textContent = `${index+1}/${total}`;
  document.getElementById('progressFill').style.width = `${((index+1)/total)*100}%`;

  const isPhrasal = word.word.includes(' ');
  const wordEl = document.getElementById('quizWord');
  wordEl.textContent = word.word;
  wordEl.className = 'word' + (isPhrasal ? ' phrasal' : '');

  document.getElementById('quizPhonetic').textContent = word.phonetic;

  // Example sentence
  const sentKey = word.word;
  const sentEl = document.getElementById('sentenceText');
  if (SENTENCES[sentKey]) {
    sentEl.textContent = SENTENCES[sentKey];
  } else {
    sentEl.textContent = `"${word.word}" — ${word.meaning.replace(/^[nvadj]+\/\w+\.\s*/,'')}`;
  }

  // Choices
  const correct = word.meaning;
  const wrongPool = WORDS.filter(w => w.meaning !== correct);
  const wrongs = shuffleArray(wrongPool).slice(0, 3).map(w => w.meaning);
  const choices = shuffleArray([correct, ...wrongs]);
  const labels = ['A', 'B', 'C', 'D'];

  const container = document.getElementById('choicesContainer');
  container.innerHTML = '';
  choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${labels[i]}</span><span>${choice}</span>`;
    btn.dataset.value = choice;
    btn.dataset.correct = (choice === correct) ? '1' : '0';
    btn.onclick = () => handleChoice(btn, correct, word);
    container.appendChild(btn);
  });

  // Reset any remaining wrong-button state from previous attempts
  document.querySelectorAll('.choice-btn.wrong').forEach(b => {
    b.classList.remove('wrong');
    b.classList.remove('disabled');
  });
}

function handleChoice(btn, correct, word) {
  const isCorrect = btn.dataset.correct === '1';

  if (isCorrect) {
    // Correct! Disable all, show green, advance
    const allBtns = document.querySelectorAll('.choice-btn');
    allBtns.forEach(b => b.classList.add('disabled'));
    btn.classList.add('correct');
    showToast('✅ 回答正确！', 'success');
    setTimeout(() => showAnswer(word), 600);
  } else {
    // Wrong — mark this button red and disable only this one
    btn.classList.add('wrong');
    btn.classList.add('disabled');
    // Vibrate/shake the wrong button effect
    btn.style.animation = 'shake 0.3s ease';
    setTimeout(() => { btn.style.animation = ''; }, 300);
  }
}

// ============================================================
// ANSWER (DETAIL) PAGE
// ============================================================
function showAnswer(word) {
  if (utterance && window.speechSynthesis) window.speechSynthesis.cancel();
  getVisibleState();
  document.getElementById('answerScreen').style.display = 'block';

  const isPhrasal = word.word.includes(' ');
  const ansWordEl = document.getElementById('ansWord');
  ansWordEl.textContent = word.word;
  ansWordEl.className = 'word' + (isPhrasal ? ' phrasal' : '');

  document.getElementById('ansPhonetic').textContent = word.phonetic;
  document.getElementById('ansMeaning').textContent = word.meaning;

  const sentKey = word.word;
  document.getElementById('ansExampleEn').textContent = SENTENCES[sentKey] || '——';
  document.getElementById('ansExampleCn').textContent = TRANSLATIONS[sentKey] || '——';

  // Phrases
  const phrasesContainer = document.getElementById('ansPhrasesContainer');
  const phrasesEl = document.getElementById('ansPhrases');
  if (PHRASES[sentKey] && PHRASES[sentKey].length > 0) {
    phrasesContainer.style.display = 'block';
    phrasesEl.innerHTML = PHRASES[sentKey].map(p =>
      `<div class="phrase-item"><span class="phrase-en">${p}</span></div>`
    ).join('');
  } else {
    phrasesContainer.style.display = 'none';
  }

  // Auto-play pronunciation
  playWordAudio(word.word);
}

// ============================================================
// AUDIO (Web Speech API)
// ============================================================
let _voicesLoaded = false;
const PREFERRED_VOICES = [
  // Tier 1: best natural macOS voices
  'Samantha',   // en-US — excellent
  'Karen',      // en-AU — excellent
  'Daniel',     // en-GB — excellent British
  'Moira',      // en-IE — excellent Irish
  'Tessa',      // en-ZA — excellent
  // Tier 2: Google Chrome voices
  'Google US English',
  'Google UK English Female',
  'Google UK English Male',
  // Tier 3: remaining macOS English voices
  'Flo (英语（美国）)', 'Flo (英语（英国）)',
  'Reed (英语（美国）)', 'Reed (英语（英国）)',
  'Sandy (英语（美国）)', 'Sandy (英语（英国）)',
  'Shelley (英语（美国）)', 'Shelley (英语（英国）)',
  'Grandma (英语（美国）)', 'Grandma (英语（英国）)',
  'Grandpa (英语（美国）)', 'Grandpa (英语（英国）)',
  'Rocko (英语（美国）)', 'Rocko (英语（英国）)',
  'Eddy (英语（美国）)', 'Eddy (英语（英国）)',
  'Albert', 'Kathy', 'Rishi',
  // Fallback - any English
];

function ensureVoices() {
  return new Promise((resolve) => {
    if (_voicesLoaded) { resolve(); return; }
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
      _voicesLoaded = true;
      resolve();
      return;
    }
    window.speechSynthesis.onvoiceschanged = () => {
      _voicesLoaded = true;
      resolve();
    };
    // Safety timeout
    setTimeout(() => { _voicesLoaded = true; resolve(); }, 1000);
  });
}

function findBestVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices || voices.length === 0) return null;

  // 1. Try preferred voices by name
  for (const name of PREFERRED_VOICES) {
    const found = voices.find(v => v.name === name);
    if (found) return found;
  }

  // 2. Try any English voice, prefer en-US then en-GB
  const enUS = voices.find(v => v.lang.startsWith('en-US'));
  if (enUS) return enUS;
  const enGB = voices.find(v => v.lang.startsWith('en-GB'));
  if (enGB) return enGB;
  const enAU = voices.find(v => v.lang.startsWith('en-AU'));
  if (enAU) return enAU;
  const anyEn = voices.find(v => v.lang.startsWith('en'));
  if (anyEn) return anyEn;

  // 3. Last resort: first available voice
  return voices[0];
}

function playWordAudio(forceWord) {
  if (!window.speechSynthesis) return;
  const word = forceWord || shuffled[currentIndex]?.word;
  if (!word) return;

  window.speechSynthesis.cancel();

  // Handle speaker button on whichever page is visible
  const quizSpeaker = document.getElementById('speakerBtn');
  const ansSpeaker = document.getElementById('ansSpeakerBtn');
  [quizSpeaker, ansSpeaker].forEach(el => { if (el) el.classList.add('playing'); });

  utterance = new SpeechSynthesisUtterance(word);

  const best = findBestVoice();
  if (best) {
    utterance.voice = best;
    utterance.lang = best.lang;
  } else {
    utterance.lang = 'en-US';
  }

  // HIFI: slower, clearer, with natural pitch variation
  utterance.rate = 0.82;
  utterance.pitch = 1.05;
  utterance.volume = 1.0;

  utterance.onend = () => {
    [quizSpeaker, ansSpeaker].forEach(el => { if (el) el.classList.remove('playing'); });
  };
  utterance.onerror = () => {
    [quizSpeaker, ansSpeaker].forEach(el => { if (el) el.classList.remove('playing'); });
  };

  window.speechSynthesis.speak(utterance);
}

// Load voices eagerly
if (window.speechSynthesis) {
  ensureVoices();
  // Refresh voices list periodically (Chrome loads them async)
  window.speechSynthesis.onvoiceschanged = ensureVoices;
}

// ============================================================
// TOAST
// ============================================================
let toastTimer = null;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type + ' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.classList.remove('show');
  }, 1500);
}
